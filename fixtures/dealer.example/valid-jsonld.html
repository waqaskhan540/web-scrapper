<!doctype html>
<html lang="en-GB">
<head>
  <title>2018 Volkswagen Golf GT — Dealer Example</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [{ "@type": "ListItem", "position": 1, "name": "Used cars" }]
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Car",
    "name": "2018 Volkswagen Golf GT",
    "brand": { "@type": "Brand", "name": "Volkswagen" },
    "model": "Golf",
    "vehicleModelDate": "2018",
    "vehicleConfiguration": "GT",
    "bodyType": "Hatchback",
    "color": "Blue",
    "fuelType": "Diesel",
    "vehicleTransmission": "Manual",
    "mileageFromOdometer": { "@type": "QuantitativeValue", "value": 45000, "unitCode": "SMI" },
    "offers": { "@type": "Offer", "price": "12000.00", "priceCurrency": "GBP" }
  }
  </script>
</head>
<body>
  <h1>2018 Volkswagen Golf GT</h1>
  <p class="price">£12,000</p>
</body>
</html>
